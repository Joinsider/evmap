spring:
  application:
    name: evmap-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/evmap}
    username: ${DATABASE_USERNAME:evmap}
    password: ${DATABASE_PASSWORD:evmap}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    default-property-inclusion: non_null

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      group:
        # What the container healthcheck asks: "can this instance serve requests?". Excludes the
        # ingestion indicator on purpose — sync waits for the API to be healthy, so letting a failed
        # or never-run ingestion mark the API unhealthy would deadlock a cold start.
        container:
          include: db

# Local default: human-readable console output including the request correlation id.
# The `docker` profile (application-docker.yaml) switches the same appender to structured JSON.
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    de.joinside.evmap_service: ${LOG_LEVEL_APP:INFO}
  pattern:
    correlation: "[%X{requestId:-}] "

evmap:
  sync:
    # How long the last successful ingestion may be ago before /actuator/health reports DOWN.
    # Twice the 24 h fixed delay, so a single missed run is not an alert.
    max-age: ${SYNC_MAX_AGE:PT48H}

  # Live occupancy of individual charge points, read from national access points (ADR 0015). This is
  # a different axis from evmap.sync: it never writes master data, is queried on demand rather than
  # scheduled, and answers UNKNOWN whenever it cannot match a charge point by its exact EVSE-ID.
  availability:
    enabled: ${AVAILABILITY_ENABLED:true}
    # AFIR obliges operators to publish a status change within one minute, so caching longer throws
    # away freshness the regulation already paid for.
    ttl: PT1M
    max-cache-entries: 500
    # Box asked about when one station is opened. Matching is by identifier, so a wider box costs a
    # larger response and can never produce a wrong answer.
    station-radius: 300
    # Widest viewport answered, in degrees. Beyond it the map shows a country and live pins mean
    # nothing, while the upstream response would be enormous.
    max-viewport-span: 1.5
    max-charge-points: 5000

    # MobiData BW's Open ChargePoint DataBase (dl-de/by-2.0, attribution "MobiData BW").
    # OCPI 3.0, no API key and no registration. Density is highest in Baden-Württemberg and thins
    # out across the rest of Germany and Switzerland.
    mobidata:
      enabled: ${MOBIDATA_ENABLED:true}
      base-url: https://api.mobidata-bw.de/ocpdb/api/ocpi/3.0
      country-codes: DE,CH
      page-size: 200
      max-pages: 5
      timeout: PT10S

    # France: transport.data.gouv.fr's national consolidation of schema-irve-dynamique (Licence
    # Ouverte 2.0, attribution "transport.data.gouv.fr"). No key, no area query — the whole country is
    # one ~1,6 MB gzipped CSV, downloaded on demand and reused for refresh-interval. It joins on
    # id_pdc_itinerance, which the IRVE sync adapter stores as the charge point's EVSE-ID.
    irve:
      enabled: ${IRVE_DYNAMIC_ENABLED:true}
      csv-url: ${IRVE_DYNAMIC_CSV_URL:https://www.data.gouv.fr/api/1/datasets/r/89185b1f-f958-4c5b-9282-399a66ecee97}
      country-codes: FR
      refresh-interval: PT1M
      # A quarter of the file is months old — publishers whose feed stopped. Older rows are dropped.
      max-age: PT72H
      stale-after: PT10M
      timeout: PT15S
  security:
    jwt-secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
    jwt-ttl: PT12H
  apple:
    audience: ${APPLE_CLIENT_ID:}
    jwks-uri: https://appleid.apple.com/auth/keys
    issuer: https://appleid.apple.com
