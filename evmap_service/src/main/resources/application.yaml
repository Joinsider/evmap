spring:
  application:
    name: evmap-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/evmap}
    username: ${DATABASE_USERNAME:evmap}
    password: ${DATABASE_PASSWORD:evmap}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    default-property-inclusion: non_null

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # INCOMPLETE (a PARTIAL sync run, ADR 0019) ranks below UP here, so the root endpoint keeps
      # ADR 0004's meaning: DOWN only when ingestion failed or went stale. Must list every status —
      # one missing from the order would outrank all the others.
      status:
        order: DOWN,OUT_OF_SERVICE,UP,INCOMPLETE,UNKNOWN
      group:
        # What the container healthcheck asks: "can this instance serve requests?". Excludes the
        # ingestion indicator on purpose — sync waits for the API to be healthy, so letting a failed
        # or never-run ingestion mark the API unhealthy would deadlock a cold start.
        container:
          include: db
        # What the external monitor asks for "did the last sync deliver everything?". A PARTIAL run
        # answers 503 here and nowhere else. A custom http-mapping replaces Boot's defaults, so DOWN
        # and OUT_OF_SERVICE have to be restated.
        sync:
          include: ingestion,ingestionCompleteness
          status:
            order: DOWN,OUT_OF_SERVICE,INCOMPLETE,UP,UNKNOWN
            http-mapping:
              DOWN: 503
              OUT_OF_SERVICE: 503
              INCOMPLETE: 503

# Local default: human-readable console output including the request correlation id.
# The `docker` profile (application-docker.yaml) switches the same appender to structured JSON.
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    de.joinside.evmap_service: ${LOG_LEVEL_APP:INFO}
  pattern:
    correlation: "[%X{requestId:-}] "

evmap:
  sync:
    # How long the last successful ingestion may be ago before /actuator/health reports DOWN.
    # Twice the 24 h fixed delay, so a single missed run is not an alert.
    max-age: ${SYNC_MAX_AGE:PT48H}

  # Live occupancy of individual charge points, read from national access points (ADR 0015). This is
  # a different axis from evmap.sync: it never writes master data, is queried on demand rather than
  # scheduled, and answers UNKNOWN whenever it cannot match a charge point by its exact EVSE-ID.
  availability:
    enabled: ${AVAILABILITY_ENABLED:true}
    # AFIR obliges operators to publish a status change within one minute, so caching longer throws
    # away freshness the regulation already paid for.
    ttl: PT1M
    max-cache-entries: 500
    # Box asked about when one station is opened. Matching is by identifier, so a wider box costs a
    # larger response and can never produce a wrong answer.
    station-radius: 300
    # Widest viewport answered, in degrees. Beyond it the map shows a country and live pins mean
    # nothing, while the upstream response would be enormous.
    max-viewport-span: 1.5
    max-charge-points: 5000

    # MobiData BW's Open ChargePoint DataBase (dl-de/by-2.0, attribution "MobiData BW").
    # OCPI 3.0, no API key and no registration. Density is highest in Baden-Württemberg and thins
    # out across the rest of Germany and Switzerland.
    mobidata:
      enabled: ${MOBIDATA_ENABLED:true}
      base-url: https://api.mobidata-bw.de/ocpdb/api/ocpi/3.0
      country-codes: DE,CH
      page-size: 200
      max-pages: 5
      timeout: PT10S

    # France: transport.data.gouv.fr's national consolidation of schema-irve-dynamique (Licence
    # Ouverte 2.0, attribution "transport.data.gouv.fr"). No key, no area query — the whole country is
    # one ~1,6 MB gzipped CSV, downloaded on demand and reused for refresh-interval. It joins on
    # id_pdc_itinerance, which the IRVE sync adapter stores as the charge point's EVSE-ID.
    irve:
      enabled: ${IRVE_DYNAMIC_ENABLED:true}
      csv-url: ${IRVE_DYNAMIC_CSV_URL:https://www.data.gouv.fr/api/1/datasets/r/89185b1f-f958-4c5b-9282-399a66ecee97}
      country-codes: FR
      refresh-interval: PT1M
      # A quarter of the file is months old — publishers whose feed stopped. Older rows are dropped.
      max-age: PT72H
      stale-after: PT10M
      timeout: PT15S
  # Ad-hoc prices at the station (ADR 0022). Like availability, a different axis from evmap.sync: German
  # OCPI tariffs are read on demand and never written to master data; register prices (France) come from
  # master.charge_point_price. A price is shown only where its gross amount is established.
  pricing:
    enabled: ${PRICING_ENABLED:true}
    ttl: PT15M
    max-cache-entries: 500
    station-radius: 300

    # MobiData BW's OCPDB tariffs (dl-de/by-2.0), the German AFIR feeds of ecoMovement, chargecloud and EnBW.
    mobidata:
      enabled: ${MOBIDATA_PRICING_ENABLED:true}
      base-url: https://api.mobidata-bw.de/ocpdb/api/ocpi/3.0
      country-codes: DE
      page-size: 200
      max-pages: 5
      tariff-page-size: 1000
      max-tariff-pages: 10
      tariff-ttl: PT15M
      timeout: PT10S
      # OCPDB drops DATEX II's taxIncluded flag (binary-butterfly/ocpdb#278), so where a tariff's net or
      # gross basis is not evident from its arithmetic, it is shown only for operators checked by hand
      # against their own price pages. Names as OCPDB writes them on the location. Phase 5r fills these.
      net-price-operators:
        - Allego   # 0,64 net → 0,76 €/kWh, checked by the product owner on 2026-10-01
      gross-price-operators: []

  security:
    jwt-secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
    jwt-ttl: PT12H
    # The web client's session cookie is Secure by default. Chrome accepts that on http://localhost;
    # set SESSION_COOKIE_SECURE=false for Safari or any other plain-http development origin.
    session-cookie-secure: ${SESSION_COOKIE_SECURE:true}
    # Encrypts the Apple refresh tokens kept for revocation on account deletion (ADR 0020): base64 of
    # 32 random bytes (`openssl rand -base64 32`). Blank = none are stored, which is fine locally.
    token-encryption-key: ${TOKEN_ENCRYPTION_KEY:}
  apple:
    audience: ${APPLE_CLIENT_ID:}
    jwks-uri: https://appleid.apple.com/auth/keys
    issuer: https://appleid.apple.com

  # Where the privacy policy is published (ADR 0020). Blank: the clients show no link.
  legal:
    privacy-policy-url: ${PRIVACY_POLICY_URL:}

  # Web sign-in (ADR 0018). Blank credentials switch a provider off. Redirect URIs derive from
  # web-base-url: <web>/auth/callback/{google,github} and <web>/api/v1/auth/apple/callback.
  auth:
    web-base-url: ${WEB_BASE_URL:http://localhost:4200}
    timeout: PT10S
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
    apple-web:
      services-id: ${APPLE_SERVICES_ID:}
      team-id: ${APPLE_TEAM_ID:}
      key-id: ${APPLE_KEY_ID:}
      private-key: ${APPLE_PRIVATE_KEY:}
