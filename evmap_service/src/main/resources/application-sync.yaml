spring:
  main:
    web-application-type: none
  task:
    scheduling:
      enabled: true
  # The API deployable owns schema migration. Two Liquibase instances bootstrapping the same empty
  # database race on CREATE TABLE databasechangelog — a race Liquibase's own lock table cannot cover,
  # because the lock table is one of the tables being created. Start this container only after the
  # API reports healthy; Hibernate's ddl-auto: validate then fails loudly if the schema is missing.
  liquibase:
    enabled: false

evmap:
  # The ingestion container has no business polling live feeds: it serves no requests, and a live
  # status is worthless by the time the next batch run reads it. Off here means the providers and
  # their cache are never registered at all, rather than registered and idle.
  availability:
    enabled: false
  pricing:
    enabled: false

  sync:
    enabled: true
    fixed-delay: PT24H
    # Stations committed per transaction. One transaction for the whole run meant a single bad record
    # discarded everything ingested before it — see ADR 0007. Larger is faster, smaller loses less
    # when a batch fails; a failed batch is retried record by record either way.
    batch-size: ${SYNC_BATCH_SIZE:1000}

    # Which source is authoritative for which country (ADR 0012, "Switzerland (L2)"). The authority
    # takes over a station another source created first; a source that is not the authority no longer
    # rewrites a station the authority has claimed and is only linked to it. A country without an entry
    # has no authority and the most recent source wins. Values are the adapters' source tokens.
    # Germany: the operators' static AFIR feeds on the Mobilithek, with the register as the fallback for every
    # station they do not cover (ADR 0025). The register keeps running and keeps the stations nobody else claims.
    authority:
      DE: MOBILITHEK
      FR: IRVE
      CH: DIEMO
      LI: DIEMO
      ES: MITERD

    # Sources whose stations hide the ones they make redundant, recomputed after every run (ADR 0025): a station
    # such a source does not maintain is marked superseded when all its EVSE-IDs sit on the source's stations, or
    # when it has no EVSE-ID and lies within 30 m of one. One per country.
    supersede: MOBILITHEK

    # The operators' static AFIR feeds on the Mobilithek (Germany's access point), pulled with the organisation's
    # machine certificate — the same secrets as the API's live provider. Each operator licenses its own data (mostly
    # CC BY 4.0; credited on the website's data sources page). Feeds are read in this order and a charge point two
    # feeds carry is taken from the first, so operators' own feeds come before the platforms that relay them
    # (e-clearing.net relays ladenetz.de and ladebusiness). key is part of every station id: never change it.
    # subscription-id: the "Abonnement-ID" (all subscribed 2026-10-03); the last five need the operator's
    # approval and are skipped (404) until then; eliso is not delivered through the broker (422).
    mobilithek:
      enabled: ${MOBILITHEK_SYNC_ENABLED:true}
      keystore-path: ${MOBILITHEK_KEYSTORE_PATH:}
      keystore-base64: ${MOBILITHEK_KEYSTORE:}
      keystore-password: ${MOBILITHEK_KEYSTORE_PASSWORD:}
      timeout: PT5M
      register-source: BNetzA
      country-code: DE
      feeds:
        - { key: enbw, subscription-id: "1043150644486832128", publisher: "EnBW mobility+ AG und Co.KG" }
        - { key: tesla, subscription-id: "1043150904776970240", publisher: "Tesla Germany GmbH" }
        - { key: ewe, subscription-id: "1042939352962531328", publisher: "EWE Go GmbH" }
        - { key: wirelane, subscription-id: "1042964230017273856", publisher: "Wirelane GmbH" }
        - { key: qwello, subscription-id: "1042964307959840768", publisher: "Qwello Deutschland GmbH" }
        - { key: lichtblick, subscription-id: "1042964153467031552", publisher: "LichtBlick eMobility GmbH" }
        - { key: smatrics, subscription-id: "1043151215411482624", publisher: "SMATRICS GmbH & Co KG" }
        - { key: gpjoule, subscription-id: "1043151524556689408", publisher: "GP JOULE Connect GmbH" }
        - { key: vw, subscription-id: "1042944780727472128", publisher: "Volkswagen Group Charging GmbH" }
        - { key: audi, subscription-id: "1043151595734028288", publisher: "Audi AG" }
        - { key: pump, subscription-id: "1043151926140325888", publisher: "800 Volt Technologies GmbH" }
        - { key: enio, subscription-id: "1043151283837173760", publisher: "ENIO GmbH" }
        - { key: elu, subscription-id: "1043151350732128256", publisher: "ELU Mobility" }
        - { key: rudnick, subscription-id: "1043152078016237568", publisher: "K.u.L. Rudnick Bau und Bauträger GmbH" }
        - { key: eliso, subscription-id: "1043151660275957760", publisher: "eliso GmbH" }
        - { key: ladenetz, subscription-id: "1042945248950190080", publisher: "ladenetz.de" }
        - { key: ladebusiness, subscription-id: "1043151802379161600", publisher: "ladebusiness" }
        - { key: evprice, subscription-id: "1042964464692776960", publisher: "EW Pricing GmbH" }
        - { key: gridco, subscription-id: "1042964540861337600", publisher: "Grid & Co. GmbH" }
        - { key: road, subscription-id: "1042964616186679296", publisher: "Road B.V." }
        - { key: edri, subscription-id: "1043151417908101120", publisher: "Ampeco Ltd. (EDRI)" }
        - { key: monta, subscription-id: "1043151148528926720", publisher: "Monta ApS" }
        - { key: chargecloud, subscription-id: "1043151035895271424", publisher: "chargecloud GmbH" }
        - { key: vaylens, subscription-id: "1042964079500296192", publisher: "vaylens GmbH" }
        - { key: eround, subscription-id: "1042963996142882816", publisher: "Hamburger Energienetze GmbH (eRound)" }
        - { key: eclearing, subscription-id: "1042964712215433216", publisher: "e-clearing.net" }
        - { key: m8mit, subscription-id: "1043152155484868608", publisher: "msu solutions GmbH (m8mit)" }
        - { key: gls, subscription-id: "1043152231934427136", publisher: "GLS Mobility GmbH" }
        - { key: tcbackend, subscription-id: "1043152308979617792", publisher: "Taubert Consulting GmbH (TC-Backend)" }
        - { key: enerando, subscription-id: "1043152382682091520", publisher: "ENERANDO Technologies GmbH" }
        - { key: ecomovement, subscription-id: "1043152456975798272", publisher: "Eco-Movement" }

    # Bundesnetzagentur Ladesäulenregister (CC BY 4.0, attribution "Bundesnetzagentur.de").
    # The published file name is date-stamped, so the adapter scrapes index-url for the current
    # edition. Set csv-url to pin an edition, point at a local copy, or recover if that page changes.
    bnetza:
      enabled: ${BNETZA_ENABLED:true}
      index-url: https://www.bundesnetzagentur.de/DE/Fachthemen/ElektrizitaetundGas/E-Mobilitaet/Ladesaeulenkarte/start.html
      csv-url: ${BNETZA_CSV_URL:}
      timeout: PT5M

    # Fichier consolidé des IRVE (Etalab / data.gouv.fr, Licence Ouverte 1.0, attribution
    # "data.gouv.fr / Etalab"). The French national register: every operator and municipality publishes
    # its own file and Etalab consolidates them daily into this one download. csv-url is a stable
    # resource id that redirects to the current date-stamped edition, so unlike BNetzA there is nothing
    # to scrape — override it only to pin an edition or to point at a local copy.
    irve:
      enabled: ${IRVE_ENABLED:true}
      csv-url: ${IRVE_CSV_URL:https://www.data.gouv.fr/api/1/datasets/r/eb76d20a-8501-400e-b336-d85724de5435}
      # 162 MB / 231.647 charge points on 2026-07-29, and growing.
      timeout: PT10M

    # Swiss national register (BFE ich-tanke-strom / DIEMO, OICP JSON on data.geo.admin.ch, terms_by_ask:
    # free use with attribution, commercial use needs the supplier's permission — ADR 0012). No key, one
    # ~1 MB gzip document of 19.478 EVSEs. Only the static feed is read; the status/ feed is live
    # occupancy and stays out of master data (ADR 0015). Override url to pin a copy.
    diemo:
      enabled: ${DIEMO_ENABLED:true}
      url: ${DIEMO_URL:https://data.geo.admin.ch/ch.bfe.ladestellen-elektromobilitaet/data/oicp/ch.bfe.ladestellen-elektromobilitaet.json}
      timeout: PT2M

    # Spanish national register (MITERD, Order TED/445/2023, published by the DGT's National Access Point
    # as DATEX II v3; CC-BY per the dataset page, attribution "DGT / MITERD" — ADR 0012, "Spain (L4)").
    # No key, one ~83 MB XML document of 12.037 sites, refreshed every 24 h. Override url to pin a copy.
    miterd:
      enabled: ${MITERD_ENABLED:true}
      url: ${MITERD_URL:https://nap.dgt.es/datex2/v3/miterd/EnergyInfrastructureTablePublication/electrolineras.xml}
      timeout: PT5M

    # Open Charge Map. api-key is mandatory (the API answers 403 without one) and comes from
    # https://openchargemap.org → my profile → my apps → Register An Application. A blank key skips
    # the adapter with a warning rather than failing the run, so BNetzA-only deployments still work.
    # request-delay and max-pages-per-country exist to stay inside OCM's fair usage policy.
    ocm:
      enabled: ${OCM_ENABLED:true}
      base-url: https://api.openchargemap.io/v3
      api-key: ${OCM_API_KEY:}
      country-codes: ${OCM_COUNTRY_CODES:DE,AT,CH,NL,BE,LU,FR,IT,DK,PL,CZ}
      page-size: 500
      request-delay: PT1S
      max-pages-per-country: 200
      open-data-only: true
      timeout: PT1M
      client: evmap
      # Incremental fetching: after a country has been crawled in full once, later runs ask only for
      # what changed. The watermark advances only when a run ingested every record without failure.
      # watermark-overlap re-asks a little before it (cheap, ingestion is an upsert);
      # full-refresh-interval forces a whole-country crawl regularly, because `modifiedsince` never
      # reveals upstream deletions.
      incremental: ${OCM_INCREMENTAL:true}
      watermark-overlap: PT48H
      full-refresh-interval: P7D
