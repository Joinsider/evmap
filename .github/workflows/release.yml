name: Release

# Runs on every push to main/master (unless the commit message contains
# "[no-CI]", which is used by this workflow's own version-bump commits to
# avoid triggering itself in a loop).
#
# 1. Strips -SNAPSHOT from pom.xml and commits the release version.
# 2. Builds the jar and a Docker image, publishes both to GHCR and as a
#    GitHub release tagged vX.Y.Z.
# 3. Bumps the patch version and re-adds -SNAPSHOT for the next dev cycle.

on:
  push:
    branches: [main, master]
    paths:
      - "evmap_service/**"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[no-CI]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evmap_service
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine release version
        id: release_version
        run: |
          CURRENT_VERSION=$(./mvnw -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)
          RELEASE_VERSION=${CURRENT_VERSION%-SNAPSHOT}
          echo "current=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set release version in pom.xml
        run: |
          ./mvnw -B -ntp org.codehaus.mojo:versions-maven-plugin:2.17.1:set \
            -DnewVersion=${{ steps.release_version.outputs.release }} \
            -DgenerateBackupPoms=false

      - name: Commit release version
        run: |
          git add pom.xml
          git commit -m "chore(release): ${{ steps.release_version.outputs.release }} [skip CI]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Build with Maven
        run: ./mvnw -B -ntp clean package

      - name: Tag release commit
        run: |
          git tag "v${{ steps.release_version.outputs.release }}"
          git push origin "v${{ steps.release_version.outputs.release }}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: evmap_service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.release_version.outputs.release }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.release_version.outputs.release }}"
          name: "v${{ steps.release_version.outputs.release }}"
          prerelease: false
          make_latest: true
          files: evmap_service/target/*.jar
          body: |
            Release ${{ steps.release_version.outputs.release }}

            Docker image: `ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.release_version.outputs.release }}`

      - name: Determine next development version
        id: next_version
        run: |
          RELEASE_VERSION=${{ steps.release_version.outputs.release }}
          MAJOR=$(echo "$RELEASE_VERSION" | cut -d. -f1)
          MINOR=$(echo "$RELEASE_VERSION" | cut -d. -f2)
          PATCH=$(echo "$RELEASE_VERSION" | cut -d. -f3)
          NEXT_PATCH=$((PATCH + 1))
          NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-SNAPSHOT"
          echo "next=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set next development version in pom.xml
        run: |
          ./mvnw -B -ntp org.codehaus.mojo:versions-maven-plugin:2.17.1:set \
            -DnewVersion=${{ steps.next_version.outputs.next }} \
            -DgenerateBackupPoms=false

      - name: Commit next development version
        run: |
          git add pom.xml
          git commit -m "chore: prepare next development version ${{ steps.next_version.outputs.next }} [skip CI]"
          git push origin HEAD:${{ github.ref_name }}
