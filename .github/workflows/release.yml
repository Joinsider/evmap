name: Release

# Runs on every push to main/master, and on manual dispatch.
#
# 1. Strips -SNAPSHOT from pom.xml and BUILDS. Nothing is pushed until the
#    build has passed — a broken commit must not be able to mutate master's
#    version or leave a half-finished release behind.
# 2. Commits the release version, tags vX.Y.Z, and publishes the jar and a
#    Docker image to GHCR and as a GitHub release.
# 3. Bumps the patch version and re-adds -SNAPSHOT for the next dev cycle.
#
# The `guard` job stops step 3's own commits from re-triggering the workflow.
# It inspects only the SUBJECT line of the head commit — see that job.

on:
  push:
    branches: [main, master]
    paths:
      - "evmap_service/**"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Decides whether this push is one of the workflow's own version-bump commits.
  #
  # This deliberately looks at the head commit's SUBJECT line only, and not at
  # the whole message. A previous version tested the full message with
  # `contains(github.event.head_commit.message, '[skip CI]')`, which skipped a
  # legitimate release: a squash-merge concatenates every commit message into
  # the merge commit body, and one of those bodies merely *described* the skip
  # marker. A commit body must be free to discuss "[skip ci]" without disabling
  # the release. GitHub's own native skip handling has the same subject-only
  # semantics, which is why that run was created at all rather than suppressed.
  guard:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - name: Check head commit subject for a skip marker
        id: check
        env:
          # Via env, not string interpolation: a commit message is untrusted
          # input and must never be pasted into a shell script.
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          SUBJECT=$(printf '%s\n' "$HEAD_COMMIT_MESSAGE" | head -n 1)
          if printf '%s\n' "$SUBJECT" | grep -qiF '[skip ci]'; then
            echo "Skipping: head commit subject requests a CI skip."
            echo "  $SUBJECT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: guard
    if: ${{ needs.guard.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evmap_service
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Set image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine release version
        id: release_version
        run: |
          CURRENT_VERSION=$(./mvnw -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)
          case "$CURRENT_VERSION" in
            *-SNAPSHOT) ;;
            *)
              echo "::error::pom.xml is at '$CURRENT_VERSION', not a -SNAPSHOT version. A previous"
              echo "::error::release left the version state inconsistent; set it back to a"
              echo "::error::-SNAPSHOT version on ${{ github.ref_name }} before releasing again."
              exit 1
              ;;
          esac
          RELEASE_VERSION=${CURRENT_VERSION%-SNAPSHOT}
          if git rev-parse -q --verify "refs/tags/v$RELEASE_VERSION" >/dev/null; then
            echo "::error::Tag v$RELEASE_VERSION already exists. Bump the version in pom.xml"
            echo "::error::or remove the stale tag before releasing again."
            exit 1
          fi
          echo "current=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set release version in pom.xml
        run: |
          ./mvnw -B -ntp org.codehaus.mojo:versions-maven-plugin:2.17.1:set \
            -DnewVersion=${{ steps.release_version.outputs.release }} \
            -DgenerateBackupPoms=false

      # Everything above this point is local to the runner. The build gates all
      # pushes below it, so a failing build leaves the repository untouched.
      - name: Build with Maven
        run: ./mvnw -B -ntp clean package

      - name: Commit and tag release version
        run: |
          git add pom.xml
          git commit -m "chore(release): ${{ steps.release_version.outputs.release }} [skip CI]"
          git tag "v${{ steps.release_version.outputs.release }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v${{ steps.release_version.outputs.release }}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: evmap_service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.release_version.outputs.release }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.release_version.outputs.release }}"
          name: "v${{ steps.release_version.outputs.release }}"
          prerelease: false
          make_latest: true
          files: evmap_service/target/*.jar
          body: |
            Release ${{ steps.release_version.outputs.release }}

            Docker image: `ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.release_version.outputs.release }}`

      - name: Determine next development version
        id: next_version
        run: |
          RELEASE_VERSION=${{ steps.release_version.outputs.release }}
          MAJOR=$(echo "$RELEASE_VERSION" | cut -d. -f1)
          MINOR=$(echo "$RELEASE_VERSION" | cut -d. -f2)
          PATCH=$(echo "$RELEASE_VERSION" | cut -d. -f3)
          NEXT_PATCH=$((PATCH + 1))
          NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-SNAPSHOT"
          echo "next=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set next development version in pom.xml
        run: |
          ./mvnw -B -ntp org.codehaus.mojo:versions-maven-plugin:2.17.1:set \
            -DnewVersion=${{ steps.next_version.outputs.next }} \
            -DgenerateBackupPoms=false

      - name: Commit next development version
        run: |
          git add pom.xml
          git commit -m "chore: prepare next development version ${{ steps.next_version.outputs.next }} [skip CI]"
          git push origin HEAD:${{ github.ref_name }}
