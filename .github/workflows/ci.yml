name: CI

# Tests for both deployables on every PR and on master, plus SonarQube Cloud analysis (ADR 0016).
#
# - Each side only runs when its own code (or this file) changed. The repository is private, so macOS
#   minutes are billed at 10x Linux; an iOS run for a backend-only change would be the most expensive
#   no-op in the pipeline. A job skipped this way reports as "skipped", which branch protection
#   treats as passing, so both jobs can be required checks.
# - SonarQube Cloud runs only when the SONAR_TOKEN secret exists. Until it is set up, CI is plain
#   tests and nothing fails for the lack of it.
# - master is analysed too: SonarQube Cloud measures a PR's "new code" against the last analysis of
#   the main branch, so without it the quality gate has no baseline.

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

# Permissions are granted per job, never at workflow level: a job gets exactly what it uses.
permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # paths-filter lists a PR's changed files through the API rather than by diffing.
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'evmap_service/**'
              - '.github/workflows/ci.yml'
            ios:
              - 'evMap_ios/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: evmap_service
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history: SonarQube Cloud uses blame to attribute issues to new code.
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # verify = compile, test, and write the JaCoCo report the analysis reads.
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: SonarQube Cloud analysis
        if: env.SONAR_TOKEN != ''
        run: ./mvnw -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-reports
          path: evmap_service/target/surefire-reports/
          retention-days: 7

  ios:
    name: iOS tests
    needs: changes
    if: needs.changes.outputs.ios == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: evMap_ios/EVMap
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Pinned rather than the image default, so a runner image update cannot change the toolchain
      # under a green build. Must be at least what the project was last upgraded with
      # (LastUpgradeCheck 2660) and ship the IPHONEOS_DEPLOYMENT_TARGET SDK (26.5).
      XCODE_VERSION: '26.6'
      SIMULATOR: 'platform=iOS Simulator,name=iPhone 17,OS=26.5'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"

      # Unit tests only. The UI tests drive a real app against a backend CI does not have.
      # The EVMap scheme is not committed; xcodebuild autocreates it from the targets.
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project EVMap.xcodeproj \
            -scheme EVMap \
            -destination "$SIMULATOR" \
            -only-testing:EVMapTests \
            -enableCodeCoverage YES \
            -resultBundlePath build/Test.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Convert coverage for SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        run: python3 ../scripts/xccov-to-sonar.py build/Test.xcresult EVMap > build/sonar-coverage.xml

      - name: SonarQube Cloud analysis
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          projectBaseDir: evMap_ios/EVMap

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-results
          path: evMap_ios/EVMap/build/Test.xcresult
          retention-days: 7
