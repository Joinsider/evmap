services:
  database:
    image: kartoza/postgis:17-3.5
    environment:
      POSTGRES_DB: evmap
      POSTGRES_USER: evmap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evmap}
    ports:
      - 5433:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evmap -d evmap"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: { context: ./evmap_service, dockerfile: Dockerfile }
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/evmap
      DATABASE_USERNAME: evmap
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-evmap}
      JWT_SECRET: ${JWT_SECRET:?Set a long random JWT_SECRET}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      # Web sign-in (ADR 0018). Blank credentials switch a provider off. WEB_BASE_URL is the web
      # client's origin; every provider's redirect URI derives from it (docs/operations/sign-in-providers.md).
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:4200}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      APPLE_SERVICES_ID: ${APPLE_SERVICES_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      # The .p8 key's PEM text; newlines may be written as \n.
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      # Account area (ADR 0020). Encrypts the Apple refresh tokens kept for revocation on account
      # deletion: `openssl rand -base64 32`. Blank = none are stored. The privacy policy link is
      # shown by the clients only when the URL is set.
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      PRIVACY_POLICY_URL: ${PRIVACY_POLICY_URL:-}
      # Web map (ADR 0023): the Maps key MapKit JS tokens are signed with. Blank = no web map.
      # MAPKIT_TEAM_ID defaults to APPLE_TEAM_ID; the .p8 PEM may write newlines as \n.
      MAPKIT_TEAM_ID: ${MAPKIT_TEAM_ID:-${APPLE_TEAM_ID:-}}
      MAPKIT_KEY_ID: ${MAPKIT_KEY_ID:-}
      MAPKIT_PRIVATE_KEY: ${MAPKIT_PRIVATE_KEY:-}
      MAPKIT_ORIGIN: ${MAPKIT_ORIGIN:-localhost}
      LOG_FORMAT: ${LOG_FORMAT-ecs}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
      SYNC_MAX_AGE: ${SYNC_MAX_AGE:-PT48H}
    ports: ["8080:8080"]
    # Defined here rather than as a Dockerfile HEALTHCHECK: podman builds OCI images, which ignore it.
    # Healthy means the Liquibase migration finished — that is what the sync container waits for.
    # busybox wget ships with the alpine base image, so the image needs no HTTP client installed.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health/container || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 90s
      retries: 6
    depends_on:
      database: { condition: service_healthy }

  web:
    build: { context: ./evmap_web }
    environment:
      API_UPSTREAM: http://api:8080
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
    ports: ["8081:8080"]

  sync:
    build: { context: ./evmap_service, dockerfile: Dockerfile.sync }
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/evmap
      DATABASE_USERNAME: evmap
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-evmap}
      # Open Charge Map refuses unauthenticated calls. Empty means "BNetzA only": the adapter logs a
      # warning and skips itself rather than failing the run. Key from https://openchargemap.org.
      OCM_API_KEY: ${OCM_API_KEY:-}
      OCM_COUNTRY_CODES: ${OCM_COUNTRY_CODES:-DE,AT,CH,NL,BE,LU,FR,IT,DK,PL,CZ}
      # Empty means "discover the current edition from the Bundesnetzagentur download page".
      BNETZA_CSV_URL: ${BNETZA_CSV_URL:-}
      LOG_FORMAT: ${LOG_FORMAT-ecs}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
    depends_on:
      # Waits for the API's Liquibase migration: this container runs with liquibase disabled.
      api: { condition: service_healthy }

volumes:
  postgres-data:
