# Deployment stack — pulls the published image instead of building from source.
#
#   docker compose -f deploy/docker-compose.yml pull
#   docker compose -f deploy/docker-compose.yml up -d
#
# Copy deploy/.env.example to deploy/.env and fill in the secrets first. The root
# docker-compose.yml stays the development stack (it builds both images locally);
# this file is for a host that only consumes releases.
#
# One image serves both deployables: the release workflow publishes a single image
# built from evmap_service/Dockerfile, and Dockerfile.sync differs from it only in
# SPRING_PROFILES_ACTIVE. The sync service below overrides that variable rather than
# pulling a second image, so there is nothing to keep in sync between two tags.

services:
  database:
    # The PostGIS project's own image, built on the official postgres image — so
    # POSTGRES_DB/USER/PASSWORD below mean what they say. Do not swap in kartoza/postgis:
    # it reads POSTGRES_PASS/POSTGRES_DBNAME instead and silently ignores these, leaving a
    # `gis` database and a randomly generated password the API can never authenticate with.
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: evmap
      POSTGRES_USER: evmap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    # No published port on purpose: only the two app containers talk to the database.
    # Add a mapping temporarily if you need psql from the host.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # A real query, not pg_isready: pg_isready exits 0 even when the role or database is
    # wrong, so it would report healthy and let the API start into a connection it cannot
    # make. Passwordless because the official entrypoint trusts the local socket.
    healthcheck:
      test: ["CMD-SHELL", "psql -U evmap -d evmap -c 'SELECT 1' > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    # Pin to a released version (EVMAP_IMAGE=ghcr.io/joinsider/evmap:0.0.1) for a
    # reproducible deployment; :latest follows every release.
    image: ${EVMAP_IMAGE:-ghcr.io/joinsider/evmap:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/evmap
      DATABASE_USERNAME: evmap
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set a long random JWT_SECRET}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      # Web sign-in (ADR 0018). Blank credentials switch a provider off. WEB_BASE_URL is the web
      # client's origin; every provider's redirect URI derives from it (docs/operations/sign-in-providers.md).
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:4200}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      APPLE_SERVICES_ID: ${APPLE_SERVICES_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      # The .p8 key's PEM text; newlines may be written as \n.
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      # Account area (ADR 0020). Encrypts the Apple refresh tokens kept for revocation on account
      # deletion: `openssl rand -base64 32`. Blank = none are stored. The privacy policy link is
      # shown by the clients only when the URL is set.
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      PRIVACY_POLICY_URL: ${PRIVACY_POLICY_URL:-}
      # Web map (ADR 0023): the Maps key MapKit JS tokens are signed with. Blank = no web map.
      # MAPKIT_TEAM_ID defaults to APPLE_TEAM_ID; the .p8 PEM may write newlines as \n.
      MAPKIT_TEAM_ID: ${MAPKIT_TEAM_ID:-${APPLE_TEAM_ID:-}}
      MAPKIT_KEY_ID: ${MAPKIT_KEY_ID:-}
      MAPKIT_PRIVATE_KEY: ${MAPKIT_PRIVATE_KEY:-}
      MAPKIT_ORIGIN: ${MAPKIT_ORIGIN:-evmap.joinside.de}
      # German live availability from the Mobilithek (ADR 0015, L5): the organisation's machine certificate
      # as Base64 (`base64 -i cert.p12`) and the password sent by SMS. Blank = off; the subscription ids
      # live in application.yaml. Runbook: docs/operations/mobilithek.md.
      MOBILITHEK_KEYSTORE: ${MOBILITHEK_KEYSTORE:-}
      MOBILITHEK_KEYSTORE_PASSWORD: ${MOBILITHEK_KEYSTORE_PASSWORD:-}
      LOG_FORMAT: ${LOG_FORMAT-ecs}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
      SYNC_MAX_AGE: ${SYNC_MAX_AGE:-PT48H}
    ports:
      # Bind to loopback by default — put a TLS-terminating reverse proxy in front.
      # Set API_BIND=0.0.0.0 to expose it directly.
      - "${API_PORT:-8080}:8080"
    # Defined here rather than as a Dockerfile HEALTHCHECK: podman builds OCI images, which ignore it.
    # Healthy means the Liquibase migration finished — that is what the sync container waits for.
    # busybox wget ships with the alpine base image, so the image needs no HTTP client installed.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health/container || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 90s
      retries: 6
    depends_on:
      database: { condition: service_healthy }

  web:
    # Angular web client + nginx (ADR 0018). Point the reverse proxy for WEB_BASE_URL's domain at this
    # container only: it serves the app and proxies /api/** to the API on the same origin.
    image: ${EVMAP_WEB_IMAGE:-ghcr.io/joinsider/evmap-web:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:8080
      # Associated domain for the iOS app's HTTPS sign-in callback; empty serves no
      # apple-app-site-association (the iOS app then cannot use Google/GitHub sign-in).
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      # Impressum and privacy policy (ADR 0024, docs/operations/legal-pages.md): the operator's name, postal
      # address and e-mail, kept out of the repository. Without OPERATOR_NAME both pages say the details are missing.
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      OPERATOR_STREET: ${OPERATOR_STREET:-}
      OPERATOR_CITY: ${OPERATOR_CITY:-}
      OPERATOR_COUNTRY: ${OPERATOR_COUNTRY:-Deutschland}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}
      OPERATOR_PHONE: ${OPERATOR_PHONE:-}
    # The access log holds shortened IP addresses only (ADR 0024); rotation keeps it from growing without bound.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${WEB_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

  sync:
    image: ${EVMAP_IMAGE:-ghcr.io/joinsider/evmap:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      # Turns the API image into the ingestion deployable: the `sync` profile disables
      # Liquibase and enables the scheduled ingestion job (application-sync.yaml).
      SPRING_PROFILES_ACTIVE: sync,docker
      DATABASE_URL: jdbc:postgresql://database:5432/evmap
      DATABASE_USERNAME: evmap
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      # Open Charge Map refuses unauthenticated calls. Empty means "BNetzA only": the adapter logs a
      # warning and skips itself rather than failing the run. Key from https://openchargemap.org.
      OCM_API_KEY: ${OCM_API_KEY:-}
      OCM_COUNTRY_CODES: ${OCM_COUNTRY_CODES:-DE,AT,CH,NL,BE,LU,FR,IT,DK,PL,CZ}
      # Empty means "discover the current edition from the Bundesnetzagentur download page".
      BNETZA_CSV_URL: ${BNETZA_CSV_URL:-}
      LOG_FORMAT: ${LOG_FORMAT-ecs}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
    # No public port on purpose.
    depends_on:
      # Waits for the API's Liquibase migration: this container runs with liquibase disabled.
      api: { condition: service_healthy }

  backup:
    # Nightly pg_dump into a restic repository on an S3-compatible store on ANOTHER host, rotation,
    # a weekly restore test, and heartbeats to the external Uptime Kuma (ADR 0019). Set up once with
    # `docker compose -f deploy/docker-compose.yml run --rm backup init`; restore procedure in
    # docs/operations/backup-and-restore.md.
    image: ${EVMAP_BACKUP_IMAGE:-ghcr.io/joinsider/evmap-backup:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      PGHOST: database
      PGUSER: evmap
      PGDATABASE: evmap
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      # e.g. s3:https://s3.example.org/evmap-backup — must not live on this VPS.
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?Set RESTIC_REPOSITORY}
      # Encrypts the repository. Losing it makes every backup unreadable: keep a copy off this VPS.
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?Set RESTIC_PASSWORD}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY:?Set BACKUP_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY:?Set BACKUP_S3_SECRET_KEY}
      TZ: ${TZ:-Europe/Berlin}
      BACKUP_AT: ${BACKUP_AT:-03:30}
      # 7 daily / 4 weekly / 3 monthly: nothing in any backup is older than ~3 months, which bounds
      # how long a deleted account survives in backups (docs/privacy/data-processing.md).
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-3}
      # Uptime Kuma push monitors, URL without its query string. Empty disables the heartbeat.
      BACKUP_PUSH_URL: ${BACKUP_PUSH_URL:-}
      DISK_PUSH_URL: ${DISK_PUSH_URL:-}
      DISK_ALERT_PERCENT: ${DISK_ALERT_PERCENT:-85}
    volumes:
      # Read-only and only for `df`: the disk the database actually writes to is what can run full.
      - postgres-data:/pgdata:ro
      - backup-cache:/home/backup/.cache
    depends_on:
      database: { condition: service_healthy }

volumes:
  backup-cache:
  postgres-data:
