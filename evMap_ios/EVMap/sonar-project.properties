# SonarQube Cloud analysis of the iOS client (ADR 0016). The backend is its own project, configured in
# evmap_service/pom.xml; the two share one GitHub repository as a SonarQube Cloud monorepo.
sonar.host.url=https://sonarcloud.io
sonar.organization=joinsider
sonar.projectKey=Joinsider_evmap-ios
sonar.projectName=EVMap iOS

sonar.sources=EVMap
sonar.tests=EVMapTests,EVMapUITests
sonar.sourceEncoding=UTF-8
# Asset catalogues and the app icon are not code.
sonar.exclusions=**/*.xcassets/**,**/*.icon/**

# Written by ../scripts/xccov-to-sonar.py from the test run's .xcresult, in the same CI job.
sonar.coverageReportPaths=build/sonar-coverage.xml
