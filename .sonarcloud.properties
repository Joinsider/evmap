# SonarQube Cloud Automatic Analysis of project Joinsider_evmap (ADR 0016).
# Only read by Automatic Analysis; CI-based analysis is configured in evmap_service/pom.xml and
# evMap_ios/EVMap/sonar-project.properties instead.

# The Liquibase changelogs are PostgreSQL (`dbms:postgresql`). SonarQube Cloud has no PostgreSQL
# analyzer and checks every .sql file with its Oracle PL/SQL rules, which demand VARCHAR2 — a type
# PostgreSQL does not have. Nothing it reports there is actionable, so the files are not analysed.
sonar.exclusions=evmap_service/src/main/resources/db/changelog/**
