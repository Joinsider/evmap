# SonarQube Cloud: the whole repository is one project, analysed from CI by the `sonar` job in
# .github/workflows/ci.yml (ADR 0016). Automatic Analysis must stay off for it.
sonar.host.url=https://sonarcloud.io
sonar.organization=joinsider
sonar.projectKey=Joinsider_evmap
sonar.projectName=evmap
sonar.sourceEncoding=UTF-8

sonar.sources=evmap_service/src/main,evMap_ios/EVMap/EVMap,evMap_ios/scripts,.github
sonar.tests=evmap_service/src/test,evMap_ios/EVMap/EVMapTests,evMap_ios/EVMap/EVMapUITests

# - The Liquibase changelogs are PostgreSQL (`dbms:postgresql`). SonarQube Cloud has no PostgreSQL
#   analyzer and checks every .sql file with its Oracle PL/SQL rules, which demand VARCHAR2 — a type
#   PostgreSQL does not have. Nothing it reports there is actionable.
# - Asset catalogues and the app icon are not code.
sonar.exclusions=evmap_service/src/main/resources/db/changelog/**,**/*.xcassets/**,**/*.icon/**

# Java: bytecode and coverage come from the backend job as an artifact; sonar.java.libraries is
# passed by the workflow, which resolves the classpath on the analysing runner.
sonar.java.source=25
sonar.java.binaries=evmap_service/target/classes
sonar.java.test.binaries=evmap_service/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=evmap_service/target/site/jacoco/jacoco.xml

# Swift: sonar.coverageReportPaths is passed by the workflow, and only when the iOS job ran —
# evMap_ios/scripts/xccov-to-sonar.py writes it from the test run's .xcresult.
